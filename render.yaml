# Temporary, invite-only test deployment. Data can reset on restart/redeploy.
# Do not use for public launch. Photos remain disabled until persistent storage is configured.
services:
  - type: web
    name: raabta-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm test
    startCommand: node src/server.mjs
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PROFILE_PHOTOS_ENABLED
        value: false
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /tmp/raabta.db
      - key: REGISTRATION_MODE
        value: invite
      - key: REQUIRE_EMAIL_VERIFICATION
        value: true
      - key: MODERATION_ENABLED
        value: true
      - key: TRUST_PROXY
        value: false
      - key: DATA_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: OPERATOR_NAME
        sync: false
