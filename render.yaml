# Deployment definition only: no resource has been purchased or created.
services:
  - type: web
    name: raabta-api
    runtime: node
    plan: 0.5c-512mb
    rootDir: server
    buildCommand: npm test
    startCommand: node src/server.mjs
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: raabta-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/raabta.db
      - key: REGISTRATION_MODE
        value: invite
      - key: REQUIRE_EMAIL_VERIFICATION
        value: true
      - key: MODERATION_ENABLED
        value: true
      - key: TRUST_PROXY
        value: false
      - key: DATA_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: OPERATOR_NAME
        sync: false
